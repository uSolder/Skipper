name: OpenOCD

# Builds ST's OpenOCD (Software/OpenOCD) for Windows, macOS and Linux.
# Every run builds and tests. Pushing a tag openocd-v<version>, matching
# Software/OpenOCD/versions.env, also publishes a pre-release.

on:
  push:
    branches-ignore: [gh-pages]
    tags: ["openocd-v*"]
    paths:
      - "Software/OpenOCD/**"
      - "Software/STM32duino/debugger/**"
      - ".github/workflows/openocd.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: win32-x64, runner: ubuntu-22.04 }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config texinfo cmake zip
          if [ "${{ matrix.target }}" = win32-x64 ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64
          fi

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config texinfo

      - name: Build
        run: Software/OpenOCD/build.sh ${{ matrix.target }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: openocd-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: win32-x64, runner: windows-latest }
          - { target: darwin-arm64, runner: macos-latest }
          - { target: darwin-x64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: openocd-${{ matrix.target }}
          path: dist

      - name: Unpack
        working-directory: dist
        run: |
          for f in *.zip; do [ -e "$f" ] && unzip -q "$f"; done
          for f in *.tar.gz; do [ -e "$f" ] && tar -xzf "$f"; done
          ls openocd-st/bin

      - name: Check libraries
        run: |
          case "$RUNNER_OS" in
            Linux) ldd dist/openocd-st/bin/openocd ;;
            macOS) otool -L dist/openocd-st/bin/openocd ;;
          esac

      - name: Run OpenOCD
        run: |
          dist/openocd-st/bin/openocd --version
          # Loads the Skipper config without a probe attached: proves the
          # scripts are found next to the binary and the STM32H5 target exists.
          dist/openocd-st/bin/openocd -f Software/STM32duino/debugger/skipper.cfg -c "echo SKIPPER_CONFIG_OK; shutdown" 2>&1 | tee run.log
          grep -q SKIPPER_CONFIG_OK run.log

  release:
    if: startsWith(github.ref, 'refs/tags/openocd-v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check version
        id: version
        run: |
          source Software/OpenOCD/versions.env
          if [ "${GITHUB_REF_NAME#openocd-v}" != "$OPENOCD_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match versions.env ($OPENOCD_VERSION)"
            exit 1
          fi
          echo "version=$OPENOCD_VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$OPENOCD_REF" >> "$GITHUB_OUTPUT"
          echo "commit=$OPENOCD_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Boards Manager tool entry
        run: |
          python3 Software/OpenOCD/tool_entry.py \
            --version "${{ steps.version.outputs.version }}" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            dist > dist/openocd-st.json
          cat dist/openocd-st.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          OpenOCD from STMicroelectronics' fork, unmodified, built for Windows,
          macOS and Linux with libusb and hidapi linked in.

          Source: https://github.com/STMicroelectronics/OpenOCD/tree/${{ steps.version.outputs.commit }}
          (branch ${{ steps.version.outputs.ref }}). OpenOCD is licensed under the GNU GPL v2.

          Used by the Skipper Arduino package to upload and debug through the
          on-board DAPLink.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "OpenOCD ${{ steps.version.outputs.version }}" \
            --notes-file notes.md --prerelease
