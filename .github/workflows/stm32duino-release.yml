name: STM32duino release

# Push a tag matching Software/STM32duino/platform.txt, e.g.
# stm32duino-v0.1.0-beta.1. Versions with a suffix (-beta.1, -rc.1) or a
# 0.x number are published as pre-releases.

on:
  push:
    tags: ["stm32duino-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/STM32duino
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version
        id: version
        run: |
          version="${GITHUB_REF_NAME#stm32duino-v}"
          platform_version=$(sed -n 's/^version=//p' platform.txt)
          if [ "$version" != "$platform_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match platform.txt version $platform_version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* || "$version" == 0.* ]]; then
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          fi

      - name: Build archive and index
        run: |
          git show origin/gh-pages:package_usolder_index.json > old_index.json 2>/dev/null || rm -f old_index.json
          python3 tools/package.py \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
            --index old_index.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.bz2 \
            --title "STM32duino ${{ steps.version.outputs.version }}" \
            --generate-notes ${{ steps.version.outputs.prerelease }}

      - name: Publish index to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git worktree add ../../pages origin/gh-pages
            git -C ../../pages checkout -B gh-pages
          else
            git worktree add --detach ../../pages
            git -C ../../pages checkout --orphan gh-pages
            git -C ../../pages rm -rfq .
          fi
          cp dist/package_usolder_index.json ../../pages/
          git -C ../../pages add package_usolder_index.json
          git -C ../../pages commit -m "Add STM32duino ${{ steps.version.outputs.version }} to package index"
          git -C ../../pages push origin gh-pages
