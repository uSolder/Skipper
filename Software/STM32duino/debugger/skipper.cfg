# OpenOCD configuration for Skipper: the on-board DAPLink (CMSIS-DAP) on the
# Debug port, connected to the STM32H523 over SWD.
#
# Needs an OpenOCD with STM32H5 support (ST's fork). Used for uploading from
# the Arduino IDE; also works from the command line:
#
#   openocd -f skipper.cfg -c "program firmware.elf verify reset exit"

source [find interface/cmsis-dap.cfg]
source [file join [file dirname [info script]] skipper-swd.cfg]
source [find target/stm32h5x.cfg]
